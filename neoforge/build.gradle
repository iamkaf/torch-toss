plugins {
    id 'com.iamkaf.multiloader.neoforge'
}

def minecraftVersion = requiredProp(project, 'project.minecraft')
def isModernLine = !minecraftVersion.startsWith('1.')
def libs = catalogFor(project, minecraftVersion)
def packMcmetaFormat = minecraftVersion.startsWith('1.21') ? '81' : (minecraftVersion.startsWith('1.20') ? '15' : '8')
def packMcmetaMinMax = minecraftVersion.startsWith('1.21')
    ? ',\n    "min_format": 81,\n    "max_format": 81'
    : ''
def packMcmetaDescription = "${requiredProp(project, 'mod.name')} resources"

tasks.named('stageMergedResources').configure {
    filesMatching('pack.mcmeta') {
        expand(
            pack_format: packMcmetaFormat,
            pack_minmax: packMcmetaMinMax,
            pack_description: packMcmetaDescription
        )
    }
}

dependencies {
    implementation library(libs, 'amber-neoforge')
    implementation library(libs, 'konfig-neoforge')
}
