plugins {
    id 'com.iamkaf.multiloader.common'
}

def versionProperties = new Properties()
def versionPropertiesFile = rootProject.file("versions/${project.name}/gradle.properties")
if (versionPropertiesFile.isFile()) {
    versionPropertiesFile.withInputStream { versionProperties.load(it) }
}
def minecraftVersion = versionProperties.getProperty('project.minecraft')
if (!minecraftVersion) {
    throw new GradleException("Missing project.minecraft for ${project.path}")
}
def catalogs = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension)
def catalogName = "libsMc${minecraftVersion.replace('.', '').replace('-', '')}"
def catalog = catalogs.find(catalogName)
if (!catalog.present) {
    throw new GradleException("Missing version catalog '${catalogName}'")
}
def libs = catalog.get()
def lib = { alias ->
    def dependency = libs.findLibrary(alias)
    if (!dependency.present) {
        throw new GradleException("Missing library alias '${alias}'")
    }
    dependency.get()
}
def versionAtLeast = { current, target ->
    def parse = { version ->
        version.tokenize('.')
            .collect { part -> (part =~ /\d+/).find() ? ((part =~ /\d+/)[0] as int) : 0 }
    }
    def lhs = parse(current)
    def rhs = parse(target)
    def size = Math.max(lhs.size(), rhs.size())
    for (int i = 0; i < size; i++) {
        def l = i < lhs.size() ? lhs[i] : 0
        def r = i < rhs.size() ? rhs[i] : 0
        if (l != r) {
            return l > r
        }
    }
    return true
}

sourceSets {
    main {
        if (versionAtLeast(minecraftVersion, '1.21.10')) {
            resources.srcDir(file('src/copper/generated'))
        }
    }
}

dependencies {
    if (minecraftVersion == '1.16.5' ||
        minecraftVersion.startsWith('1.16.') ||
        minecraftVersion == '1.16' ||
        minecraftVersion.startsWith('1.15.') ||
        minecraftVersion == '1.15' ||
        minecraftVersion.startsWith('1.14.')) {
        modImplementation lib('amber-fabric')
        modCompileOnly lib('konfig-fabric')
    } else {
        implementation lib('amber')
        compileOnly lib('konfig')
    }
}
